plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group 'com.vitalex.ramus'
// Must stay in sync with the root build.gradle version (single release line).
version '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation project(':core')
    implementation project(':gui-qualifier')
    implementation project(':idef0-common')
    implementation project(':idef0-core')
    implementation project(':excel-import-export')
    implementation project(':print-to-pdf')
    implementation 'tablelayout:TableLayout:20050920'
    implementation project(':gui-framework-common')
    implementation project(':gui-framework-core')
    implementation project(':data-framework-common')
    implementation project(':database-storage')

    implementation project(':chart-common')
    implementation project(':chart-core')
    implementation project(':chart-gui')

    implementation 'com.h2database:h2:2.5.252'
    // T3.1: FlatLaf look-and-feel (light/dark themes)
    implementation 'com.formdev:flatlaf:3.8'
    testImplementation group: 'junit', name: 'junit', version: '4.11'
}

task runLocal(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = "com.ramussoft.local.Main"
    workingDir = rootProject.projectDir
    if (project.hasProperty('open')) {
        args = [project.property('open')]
    }
    // T3.1: optional theme selection, e.g. ./gradlew runLocal -Ptheme=dark
    if (project.hasProperty('theme')) {
        systemProperty 'ramus.theme', project.property('theme')
    }
}

application {
    mainClass = 'com.ramussoft.local.Main'
    applicationName = 'Ramus'
}

shadowJar {
    archiveBaseName.set('ramus')
    archiveClassifier.set('')
    archiveVersion.set('')
    
    mergeServiceFiles()
    
    manifest {
        attributes 'Main-Class': 'com.ramussoft.local.Main',
                   'Implementation-Version': project.version.toString()
    }
}

// --- macOS packaging (ICNS + DMG via jpackage) ---

def packagingWorkDir = file("${buildDir}/packaging")
def jpkgInputDir = file("${packagingWorkDir}/input")
def runtimeImageDir = file("${packagingWorkDir}/runtime")

def macWorkDir = file("${buildDir}/macos")
def iconsetDir = file("${macWorkDir}/AppIcon.iconset")
def icnsFile = file("${macWorkDir}/Ramus.icns")
def dmgDestDir = file("${rootProject.projectDir}/dest/macos")

def packagingArch = {
    def archOf = { File release ->
        if (!release?.isFile()) return null
        def line = release.readLines().find { it.startsWith('OS_ARCH=') }
        return line == null ? null
                : line.substring('OS_ARCH='.length()).replace('"', '').trim()
    }
    def home = (project.findProperty('packagingJavaHome')
            ?: project.findProperty('org.gradle.java.home')
            ?: System.getenv('JAVA_HOME')
            ?: System.getProperty('java.home')).toString()
    def arch = archOf(new File(runtimeImageDir, 'release')) ?:
            archOf(new File(home, 'release')) ?:
                    System.getProperty('os.arch')
    return (arch == 'aarch64') ? 'arm64'
            : ((arch == 'x86_64' || arch == 'amd64') ? 'x86_64' : arch)
}

def packagingVersion = {
    def raw = (project.version ?: '1.0.0').toString().replaceAll(/[^0-9.]/, '')
    return (raw ==~ /\d+(\.\d+){0,2}/) ? raw : '1.0.0'
}
// Note: jpackage on macOS rejects app versions whose first number is zero
// ("The first number in an app-version cannot be zero or negative") — the
// release line is 1.x, so this never triggers.

// Final release file names: Ramus-<version>-<platform>-<arch>[-purpose].<ext>.
// jpackage's own output names differ per OS (Ramus-1.0.0.exe, ramus_1.0.0_amd64.deb,
// ramus-1.0.0-1.x86_64.rpm), so the newest matching file is renamed to one
// intuitive scheme; the README's downloads table documents it.
def renameForRelease = { File destDir, String platform, String arch, String purpose, String ext ->
    def v = packagingVersion()
    def finalName = "Ramus-${v}-${platform}-${arch}" + (purpose ? "-${purpose}" : '') + ext
    def built = destDir.listFiles()?.findAll { it.name.endsWith(ext) && it.name != finalName }
            ?.sort { a, b -> b.lastModified() <=> a.lastModified() }?.first()
    if (built == null) {
        println "Nothing to rename in ${destDir} for ${finalName}"
        return
    }
    def target = new File(destDir, finalName)
    if (target.exists()) target.delete()
    if (!built.renameTo(target)) throw new GradleException("could not rename ${built.name} -> ${finalName}")
    println "Package: ${target}"
}

tasks.register('prepareMacIcons') {
    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            throw new GradleException('prepareMacIcons must be executed on macOS (uses sips)')
        }
        iconsetDir.mkdirs()
        def srcBase = file("${rootProject.projectDir}/packaging/macos/AppIcon.appiconset")
        if (!srcBase.exists()) {
            throw new GradleException("Missing dest/Assets.xcassets/AppIcon.appiconset with mac icon images")
        }
        def mapping = [
            'icon_16x16.png'      : [file:'16-mac.png',   size:16],
            'icon_16x16@2x.png'   : [file:'32-mac.png',   size:32],
            'icon_32x32.png'      : [file:'32-mac.png',   size:32],
            'icon_32x32@2x.png'   : [file:'64-mac.png',   size:64],
            'icon_128x128.png'    : [file:'128-mac.png',  size:128],
            'icon_128x128@2x.png' : [file:'256-mac.png',  size:256],
            'icon_256x256.png'    : [file:'256-mac.png',  size:256],
            'icon_256x256@2x.png' : [file:'512-mac.png',  size:512],
            'icon_512x512.png'    : [file:'512-mac.png',  size:512],
            'icon_512x512@2x.png' : [file:'1024-mac.png', size:1024],
        ]
        mapping.each { targetName, meta ->
            def src = new File(srcBase, meta.file)
            if (!src.exists()) throw new GradleException("Missing icon asset: ${src}")
            def out = new File(iconsetDir, targetName)
            // Convert to true PNG and ensure correct dimensions using sips
            // sips -s format png -z <h> <w> <in> --out <out>
            exec {
                commandLine 'sips', '-s', 'format', 'png', '-z', meta.size as String, meta.size as String, src.absolutePath, '--out', out.absolutePath
            }
        }
        println "Prepared iconset at: ${iconsetDir}"
    }
}

tasks.register('makeIcns') {
    dependsOn 'prepareMacIcons'
    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            throw new GradleException('makeIcns requires macOS (iconutil)')
        }
        exec {
            commandLine 'iconutil', '-c', 'icns', iconsetDir.absolutePath, '-o', icnsFile.absolutePath
        }
        println "Built ICNS: ${icnsFile}"
    }
}

tasks.register('prepareJpackageInput') {
    dependsOn shadowJar
    doLast {
        jpkgInputDir.mkdirs()
        copy {
            from shadowJar.archiveFile.get().asFile
            into jpkgInputDir
            rename { 'ramus.jar' }
        }
        println "Prepared jpackage input at: ${jpkgInputDir}"
    }
}

// Build a minimized runtime image with jlink using detected modules
// The runtime image is not macOS-specific: Windows packaging needs exactly the
// same one, and jlink builds it wherever it runs.
tasks.register('jlinkImage') {
    dependsOn 'prepareJpackageInput'
    doLast {
        if (project.findProperty('packagingUseJlink')?.toString()?.toBoolean() == false) {
            println 'jlinkImage skipped: packagingUseJlink=false (using full JDK runtime)'
            // Remove a stale jlinked image from an earlier step in the same
            // build, otherwise the package would silently pick it up.
            runtimeImageDir.deleteDir()
            return
        }
        def javaHome = (project.findProperty('packagingJavaHome') ?: project.findProperty('org.gradle.java.home') ?: System.getenv('JAVA_HOME') ?: System.getProperty('java.home'))
        def jdepsBin = (project.findProperty('packagingJdepsBin') ?: new File(javaHome, 'bin/jdeps').absolutePath)
        def jlinkBin = (project.findProperty('packagingJlinkBin') ?: new File(javaHome, 'bin/jlink').absolutePath)
        def explicitJmods = project.findProperty('packagingJmodsPath')
        // Build a module-path for jlink that works across different JDK layouts (Temurin/Oracle/GraalVM)
        def modulePathCandidates = [] as List<File>
        if (explicitJmods) modulePathCandidates << new File(explicitJmods.toString())
        modulePathCandidates.addAll([
                new File(javaHome, 'jmods'),
                new File(javaHome, 'lib/jmods'),
                new File(javaHome, 'lib/modules')
        ])
        modulePathCandidates = modulePathCandidates.findAll { it.exists() }
        if (modulePathCandidates.isEmpty()) {
            println "jlinkImage warning: No platform modules found under ${javaHome}. Looked in packagingJmodsPath, jmods, lib/jmods, lib/modules. Falling back to full JDK at runtime."
            return
        }
        def jmodsDir = modulePathCandidates.collect { it.absolutePath }.join(File.pathSeparator)
        runtimeImageDir.deleteDir() // jlink requires output directory to NOT exist

        def mr = (System.properties['java.specification.version'] ?: '17').toString()
        def sout = new ByteArrayOutputStream()
        def serr = new ByteArrayOutputStream()
        try {
            exec {
                // -q to suppress warnings mixing into stdout on some JDKs
                commandLine jdepsBin, '-q', '--multi-release', mr, '--ignore-missing-deps', '--print-module-deps', new File(jpkgInputDir, 'ramus.jar').absolutePath
                standardOutput = sout
                errorOutput = serr
                ignoreExitValue true
            }
        } catch (Exception ex) {
            println "jlinkImage warning: jdeps not available at ${jdepsBin}. Falling back to default module set."
        }
        def raw = sout.toString()
        def lines = raw.readLines().collect { it.trim() }.findAll { it }
        // Pick the last line that looks like a comma-separated module list
        def detected = lines.reverse().find { it ==~ /[a-z0-9_.]+(\s*,\s*[a-z0-9_.]+)*/ }
        if (!detected) {
            // Reasonable default set for Swing + H2 + common APIs
            detected = 'java.base,java.desktop,java.datatransfer,java.logging,java.prefs,java.scripting,java.xml,java.xml.crypto,java.sql,java.naming,jdk.unsupported,jdk.charsets,jdk.xml.dom'
            println "jdeps did not detect modules; using default set: ${detected}"
        } else {
            // Sanitize and ensure base module present
            def mods = detected.split(',').collect { it.trim() }.findAll { it ==~ /[a-z][a-z0-9_.]*/ }
            if (!mods.contains('java.base')) mods.add(0, 'java.base')
            detected = mods.unique().join(',')
            println "Detected modules: ${detected}"
        }

        // jdeps sees only what bytecode references by name, so modules reached
        // through service lookup or Charset.forName() stay invisible to it.
        // Without them the bundled runtime starts and then fails at the worst
        // possible moment — on opening a file or sorting a list:
        //   jdk.localedata  — dates and Cyrillic sorting outside the root locale
        //   jdk.charsets    — cp1251 in IDL import/export and PDF output
        //   jdk.zipfs       — the jar:/zip: filesystem provider
        //   jdk.crypto.ec   — TLS handshakes with modern servers
        //   jdk.unsupported — sun.misc.Unsafe, still used by libraries
        //   java.logging    — java.util.logging backend
        def extras = ['jdk.localedata', 'jdk.charsets', 'jdk.zipfs',
                      'jdk.crypto.ec', 'jdk.unsupported', 'java.logging']
        def all = (detected.split(',').collect { it.trim() } + extras).unique()
        detected = all.join(',')
        println "Runtime modules: ${detected}"
        try {
            exec {
                // Locale data is the bulk of jdk.localedata, so the image keeps
                // only the languages the interface is translated into. Override
                // with -PpackagingLocales=en,uk,ru,pl when that is not enough.
                def locales = (project.findProperty('packagingLocales') ?: 'en,uk,ru').toString()
                commandLine jlinkBin,
                        '--module-path', jmodsDir,
                        '--add-modules', detected,
                        '--include-locales', locales,
                        '--no-header-files', '--no-man-pages', '--strip-debug',
                        '--compress', 'zip-6',
                        '--output', runtimeImageDir.absolutePath
            }
            println "Built custom runtime image at: ${runtimeImageDir}"
        } catch (Exception ex) {
            println "jlinkImage warning: jlink failed (${ex.message}). Falling back to full JDK at runtime."
            runtimeImageDir.deleteDir()
        }
    }
}

// Build the .app bundle only (no package); the DMG is assembled by
// buildCustomDmg so it can carry a background image and icon layout.
tasks.register('jpackageMacApp', Exec) {
    dependsOn 'prepareJpackageInput', 'makeIcns', 'jlinkImage'
    workingDir packagingWorkDir
    doFirst {
        if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            throw new GradleException('jpackageMacApp must be executed on macOS')
        }
        dmgDestDir.mkdirs()
        packagingWorkDir.mkdirs()
        // jpackage refuses to build over an existing app bundle.
        def existing = new File(dmgDestDir, 'Ramus.app')
        if (existing.exists()) existing.deleteDir()
        // Resolve the command line at execution time (after jlinkImage has run)
        // so that a retry in the same build sees the current filesystem state.
        def javaHome = (project.findProperty('packagingJavaHome')
                ?: project.findProperty('org.gradle.java.home')
                ?: System.getenv('JAVA_HOME')
                ?: System.getProperty('java.home')).toString()
        def jpackageBin = new File(javaHome, 'bin/jpackage').absolutePath
        def appVer = packagingVersion()
        // Choose a runtime image: prefer the jlink output, otherwise use the full JDK
        def runtimePath = (runtimeImageDir.exists() && new File(runtimeImageDir,
                'bin/java').exists()) ? runtimeImageDir.absolutePath : javaHome
        commandLine = [
                jpackageBin,
                '--type', 'app-image',
                '--dest', dmgDestDir.absolutePath,
                '--name', 'Ramus',
                '--app-version', appVer,
                '--input', jpkgInputDir.absolutePath,
                '--main-jar', 'ramus.jar',
                '--main-class', 'com.ramussoft.local.Main',
                '--icon', icnsFile.absolutePath,
                '--vendor', 'Ramus Project',
                '--mac-package-identifier', 'com.vitalex.ramus',
                '--runtime-image', runtimePath,
                '--java-options', '-Dapple.laf.useScreenMenuBar=true',
                '--java-options', '-Dapple.awt.application.name=Ramus']
    }
}

// Assemble a classic "drag to Applications" DMG: a background image with an
// arrow, the app on the left and an Applications shortcut on the right.
tasks.register('buildCustomDmg') {
    dependsOn 'jpackageMacApp'
    doLast {
        if (!org.gradle.internal.os.OperatingSystem.current().isMacOsX()) {
            throw new GradleException('buildCustomDmg must be executed on macOS (hdiutil, osascript)')
        }
        def bgFile = file("${rootProject.projectDir}/packaging/macos/dmg-background.png")
        if (!bgFile.isFile()) {
            throw new GradleException("Missing DMG background image: ${bgFile}")
        }
        def stageDir = new File(packagingWorkDir, 'dmg-stage')
        def workDir = new File(packagingWorkDir, 'dmg-work')
        stageDir.deleteDir()
        workDir.deleteDir()
        stageDir.mkdirs()
        workDir.mkdirs()

        // 1. Stage folder: the app + a symlink to /Applications.
        exec { commandLine 'cp', '-R', new File(dmgDestDir, 'Ramus.app').absolutePath, stageDir.absolutePath }
        exec { commandLine 'ln', '-s', '/Applications', new File(stageDir, 'Applications').absolutePath }

        def mountDir = new File(workDir, 'mount')
        def outDmg = new File(dmgDestDir, 'Ramus.dmg')
        if (outDmg.exists()) outDmg.delete()

        // The "classic" layout (background + icon positions) needs HFS+ and a
        // Finder session; on CI either can misbehave. Everything below is
        // best-effort — any failure falls back to a plain drag-to-Applications
        // DMG built straight from the stage folder, so a release always gets
        // a working image.
        def customOk = false
        try {
            // 1. Read/write intermediate image (a plain folder copy keeps no
            //    view settings, so the layout is applied to the mounted volume).
            def rwDmg = new File(workDir, 'ramus-rw.dmg')
            exec { commandLine 'hdiutil', 'create', '-srcfolder', stageDir.absolutePath,
                    '-volname', 'Ramus', '-fs', 'HFS+', '-size', '600m', '-ov', rwDmg.absolutePath }

            // 2. Mount and teach Finder the window layout + background picture.
            mountDir.mkdirs()
            exec { commandLine 'hdiutil', 'attach', rwDmg.absolutePath,
                    '-nobrowse', '-mountpoint', mountDir.absolutePath }
            try {
                def scpt = new File(workDir, 'dmg-view.scpt')
                scpt.text = '''on run argv
    set theMount to item 1 of argv
    set theBg to item 2 of argv
    tell application "Finder"
        set theDisk to open (POSIX file theMount) as alias
        delay 1
        -- CI machines are slow: retry until the Finder window exists.
        set theWindow to missing value
        repeat 15
            try
                set theWindow to container window of theDisk
                exit repeat
            on error
                delay 1
            end try
        end repeat
        if theWindow is missing value then error "no Finder window for the mounted DMG"
        set current view of theWindow to icon view
        set toolbar visible of theWindow to false
        set statusbar visible of theWindow to false
        set true view width of theWindow to 640
        set true view height of theWindow to 400
        set position of theWindow to {100, 100}
        set viewOptions to icon view options of theWindow
        set arrangement of viewOptions to none
        set icon size of viewOptions to 100
        set background picture of viewOptions to (POSIX file theBg) as alias
        set position of item "Ramus.app" of theWindow to {170, 175}
        set position of item "Applications" of theWindow to {450, 175}
        delay 1
    end tell
end run'''
                exec { commandLine 'osascript', scpt.absolutePath, mountDir.absolutePath, bgFile.absolutePath }
            } finally {
                try { exec { commandLine 'hdiutil', 'detach', mountDir.absolutePath, '-quiet' } }
                catch (ignored) { /* already detached */ }
            }

            // 3. Compress the laid-out image into the distributable DMG.
            if (outDmg.exists()) outDmg.delete()
            exec { commandLine 'hdiutil', 'convert', rwDmg.absolutePath,
                    '-o', outDmg.absolutePath, '-format', 'UDZO' }
            customOk = true
        } catch (Exception e) {
            println "WARN: custom DMG layout failed (${e.getMessage()}); building a plain DMG instead"
        }
        if (!customOk) {
            if (outDmg.exists()) outDmg.delete()
            exec { commandLine 'hdiutil', 'create', '-srcfolder', stageDir.absolutePath,
                    '-volname', 'Ramus', '-format', 'UDZO', outDmg.absolutePath }
        }
        println "DMG: ${outDmg}" + (customOk ? " (with background layout)" : " (plain fallback)")
    }
}

tasks.register('macDmg') {
    group = 'distribution'
    description = 'Builds a drag-to-Applications DMG (with background) at dest/macos.'
    dependsOn 'buildCustomDmg'
    doLast {
        renameForRelease(dmgDestDir, 'macos', packagingArch(), null, '.dmg')
    }
}
// --- Windows packaging (MSI or EXE via jpackage + WiX) ---

def winDestDir = file("${rootProject.projectDir}/dest/windows")
def winIconFile = file("${rootProject.projectDir}/dest/win32-bin/icon.ico")
def winAssociations = file("${rootProject.projectDir}/packaging/windows")

def winUpgradeUuid = 'CB3AA8FE-7C16-44D5-BB42-F99F9D299ACB'

tasks.register('winPackage', Exec) {
    dependsOn 'prepareJpackageInput', 'jlinkImage'

    def type = (project.findProperty('packagingWinType') ?: 'msi').toString()

    doFirst {
        if (!org.gradle.internal.os.OperatingSystem.current().isWindows())
            throw new GradleException('winPackage must be executed on Windows:'
                    + ' jpackage builds Windows packages only on Windows.'
                    + ' See .github/workflows/windows-installer.yml')
        // app-image needs no installer tooling (WiX) and yields a portable
        // folder; msi/exe need WiX Toolset 3 installed.
        if (!(type in ['msi', 'exe', 'app-image']))
            throw new GradleException("packagingWinType must be msi, exe or app-image, not ${type}")
        if (!winIconFile.isFile())
            throw new GradleException("Missing icon: ${winIconFile}")
        winDestDir.mkdirs()
        packagingWorkDir.mkdirs()
        // jpackage refuses to build over an existing app-image root.
        if (type == 'app-image') {
            def existing = new File(winDestDir, 'Ramus')
            if (existing.exists()) existing.deleteDir()
        }
        // Resolve the command line at execution time (after jlinkImage has run)
        // so that a retry in the same build sees the current filesystem state.
        def javaHome = (project.findProperty('packagingJavaHome') ?: project.findProperty('org.gradle.java.home') ?: System.getenv('JAVA_HOME') ?: System.getProperty('java.home')).toString()
        def jpackageBin = new File(javaHome, 'bin/jpackage.exe').absolutePath
        def runtimePath = (runtimeImageDir.exists() && new File(runtimeImageDir, 'bin/java.exe').exists()) ? runtimeImageDir.absolutePath : javaHome
        def args = [
                jpackageBin,
                '--type', type,
                '--dest', winDestDir.absolutePath,
                '--name', 'Ramus',
                '--app-version', packagingVersion(),
                '--input', jpkgInputDir.absolutePath,
                '--main-jar', 'ramus.jar',
                '--main-class', 'com.ramussoft.local.Main',
                '--icon', winIconFile.absolutePath,
                '--vendor', 'Ramus Project',
                '--description', 'Ramus — business process modelling (IDEF0, DFD)',
                '--runtime-image', runtimePath]
        if (type != 'app-image') {
            // Installer-specific options; invalid for app-image.
            args += [
                    '--win-per-user-install',
                    '--win-menu',
                    '--win-menu-group', 'Ramus',
                    '--win-shortcut',
                    '--win-upgrade-uuid', winUpgradeUuid,
                    '--file-associations', new File(winAssociations, 'association-rsf.properties').absolutePath]
            if (type == 'exe') {
                // EXE is a WiX Burn bundle with a full wizard: let the user
                // pick the install directory and choose which shortcuts to
                // create (desktop / Start menu). MSI stays a basic package
                // for silent/enterprise installs.
                args += ['--win-dir-chooser', '--win-shortcut-prompt']
            }
        }
        commandLine = args
    }

    workingDir packagingWorkDir

    doLast {
        // EXE is the wizard installer; MSI stays a plain silent package;
        // app-image yields a folder (Ramus/), nothing to rename.
        if (type == 'exe')
            renameForRelease(winDestDir, 'windows', 'x64', 'setup', '.exe')
        else if (type == 'msi')
            renameForRelease(winDestDir, 'windows', 'x64', null, '.msi')
    }
}

tasks.register('winInstaller') {
    group = 'distribution'
    description = 'Builds a Windows installer at dest/windows using jpackage'
    dependsOn 'winPackage'
}

// --- Linux packaging (deb, rpm or portable app-image via jpackage) ---

def linuxDestDir = file("${rootProject.projectDir}/dest/linux")

tasks.register('linuxPackage', Exec) {
    dependsOn 'prepareJpackageInput', 'jlinkImage'

    def type = (project.findProperty('packagingLinuxType') ?: 'app-image').toString()

    doFirst {
        if (!org.gradle.internal.os.OperatingSystem.current().isLinux())
            throw new GradleException('linuxPackage must be executed on Linux:'
                    + ' jpackage builds Linux packages only on Linux.'
                    + ' See .github/workflows/linux-packages.yml')
        // app-image needs no extra tooling; deb needs dpkg tools and rpm
        // needs rpmbuild (both preinstalled on GitHub runners).
        if (!(type in ['deb', 'rpm', 'app-image']))
            throw new GradleException("packagingLinuxType must be deb, rpm or app-image, not ${type}")
        linuxDestDir.mkdirs()
        packagingWorkDir.mkdirs()
        // jpackage refuses to build over an existing app-image root.
        if (type == 'app-image') {
            def existing = new File(linuxDestDir, 'Ramus')
            if (existing.exists()) existing.deleteDir()
        }
        // Resolve the command line at execution time (after jlinkImage has run)
        // so that a retry in the same build sees the current filesystem state.
        def javaHome = (project.findProperty('packagingJavaHome') ?: project.findProperty('org.gradle.java.home') ?: System.getenv('JAVA_HOME') ?: System.getProperty('java.home')).toString()
        def jpackageBin = new File(javaHome, 'bin/jpackage').absolutePath
        def runtimePath = (runtimeImageDir.exists() && new File(runtimeImageDir, 'bin/java').exists()) ? runtimeImageDir.absolutePath : javaHome
        def args = [
                jpackageBin,
                '--type', type,
                '--dest', linuxDestDir.absolutePath,
                '--name', 'Ramus',
                '--app-version', packagingVersion(),
                '--input', jpkgInputDir.absolutePath,
                '--main-jar', 'ramus.jar',
                '--main-class', 'com.ramussoft.local.Main',
                '--vendor', 'Ramus Project',
                '--description', 'Ramus — business process modelling (IDEF0, DFD)',
                '--runtime-image', runtimePath]
        if (type != 'app-image') {
            // Installer-specific: create a .desktop launcher entry in the
            // "Office" menu category (freedesktop.org standard category).
            args += ['--linux-shortcut', '--linux-app-category', 'Office']
        }
        commandLine = args
    }

    workingDir packagingWorkDir

    doLast {
        if (type in ['deb', 'rpm'])
            renameForRelease(linuxDestDir, 'linux', 'x64', null, ".${type}")
    }
}

tasks.register('linuxPortable') {
    group = 'distribution'
    description = 'Tars the Linux app-image as Ramus-<version>-linux-x64-portable.tar.gz (run after linuxPackage -PpackagingLinuxType=app-image)'
    doLast {
        def dir = file("${rootProject.projectDir}/dest/linux")
        def app = new File(dir, 'Ramus')
        if (!app.isDirectory())
            throw new GradleException("no Linux app-image at ${app} — run linuxPackage -PpackagingLinuxType=app-image first")
        def out = new File(dir, "Ramus-${packagingVersion()}-linux-x64-portable.tar.gz")
        if (out.exists()) out.delete()
        exec { workingDir dir; commandLine 'tar', 'czf', out.name, 'Ramus' }
        println "Package: ${out}"
    }
}

task createMacApp(type: Copy, dependsOn: [shadowJar, makeIcns]) {
    // Resolve bundle directories eagerly so Gradle doesn't treat DirectoryProperty objects as strings.
    def appDir = new File(buildDir, 'mac-app/Ramus.app')
    def contentsDir = new File(appDir, 'Contents')
    def macOSDir = new File(contentsDir, 'MacOS')
    def resourcesDir = new File(contentsDir, 'Resources')

    from shadowJar.archiveFile
    into macOSDir
    rename { filename -> 'ramus.jar' }

    doLast {
        // Create app bundle structure
        macOSDir.mkdirs()
        resourcesDir.mkdirs()

        // Copy app icon (prefer generated .icns)
        def iconFile = file("${macWorkDir}/Ramus.icns")
        if (!iconFile.exists()) {
            iconFile = file('src/main/resources/Ramus.icns')
        }
        if (iconFile.exists()) {
            copy { from iconFile; into resourcesDir }
        }

        // Create Info.plist
        def infoPlist = new File(contentsDir, 'Info.plist')
        infoPlist.text = """<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleName</key>
    <string>Ramus</string>
    <key>CFBundleDisplayName</key>
    <string>Ramus</string>
    <key>CFBundleIdentifier</key>
    <string>com.vitalex.ramus</string>
    <key>CFBundleVersion</key>
    <string>2.0</string>
    <key>CFBundleShortVersionString</key>
    <string>2.0</string>
    <key>CFBundleExecutable</key>
    <string>Ramus</string>
    <key>CFBundleIconFile</key>
    <string>Ramus</string>
    <key>CFBundleInfoDictionaryVersion</key>
    <string>6.0</string>
    <key>CFBundlePackageType</key>
    <string>APPL</string>
    <key>CFBundleSignature</key>
    <string>????</string>
    <key>LSMinimumSystemVersion</key>
    <string>10.9</string>
    <key>NSHighResolutionCapable</key>
    <true/>
</dict>
</plist>"""

        // Create executable script
        def executable = new File(macOSDir, 'Ramus')
        executable.text = """#!/bin/bash
cd "\$(dirname "\$0")"
# Use the app's icon in the Dock instead of the Java default
exec java -Xdock:name=Ramus -Xdock:icon="../Resources/Ramus.icns" -jar ramus.jar "\$@"
"""
        executable.setExecutable(true)

        println "macOS app created at: ${appDir.absolutePath}"
    }
}
