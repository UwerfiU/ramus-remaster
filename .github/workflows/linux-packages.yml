name: Linux packages

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - 'packaging/**'
      - 'local-client/build.gradle'
      - '.github/workflows/linux-packages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build portable app-image (retry, then no-jlink fallback)
        run: |
          if ./gradlew linuxPackage -PpackagingLinuxType=app-image --no-daemon; then
            exit 0
          fi
          echo '=== first attempt failed — diagnostics ==='
          find local-client/build/packaging/runtime -type l 2>/dev/null | head -5 || true
          df -h /home/runner || true
          ls -laR dest/linux 2>/dev/null | head -20 || true
          rm -rf dest/linux
          echo '=== retry with full JDK runtime (no jlink) ==='
          ./gradlew linuxPackage -PpackagingLinuxType=app-image -PpackagingUseJlink=false --no-daemon
          # Remember that the jlinked runtime is broken on this runner so the
          # deb/rpm steps below use the full JDK as well.
          echo "NOLINK=true" >> "$GITHUB_ENV"

      - name: Smoke test under a virtual display
        run: |
          # Linux app-image layout: the launcher lives in bin/, not at the root.
          code=0
          timeout 30 xvfb-run -a dest/linux/Ramus/bin/Ramus || code=$?
          if [ "$code" -ne 124 ]; then
            echo "the application exited right after start, code $code"
            exit 1
          fi
          echo 'Still running after 30 s — the application starts'

      - name: Build deb package
        run: |
          extra=""
          if [ "$NOLINK" = "true" ]; then extra="-PpackagingUseJlink=false"; fi
          ./gradlew linuxPackage -PpackagingLinuxType=deb --no-daemon $extra

      - name: Build rpm package
        run: |
          extra=""
          if [ "$NOLINK" = "true" ]; then extra="-PpackagingUseJlink=false"; fi
          ./gradlew linuxPackage -PpackagingLinuxType=rpm --no-daemon $extra

      - name: Package the portable build
        run: |
          ./gradlew linuxPortable --no-daemon
          rm -rf dest/linux/Ramus

      - uses: actions/upload-artifact@v4
        with:
          name: ramus-linux
          path: dest/linux/*
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes 2>/dev/null || true
          gh release upload "$GITHUB_REF_NAME" \
            dest/linux/*.tar.gz dest/linux/*.deb dest/linux/*.rpm --clobber
